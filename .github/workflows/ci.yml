name: CI

on:
  push:
    branches: ['develop/**', 'release/**']
  pull_request:
    branches: ['develop/**', 'release/**']

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  TZ: Asia/Shanghai
  BUILD_PACKAGES: >-
    build-essential automake autopoint gettext pkg-config binutils-dev bison
    byacc ccache flex libiberty-dev libtool libomp-dev maven zip unzip make
    cmake ninja-build patch lld bzip2 wget curl xz-utils python3 python-is-python3
  THIRDPARTY_KEY_FILES: >-
    thirdparty/vars.sh
    thirdparty/build-thirdparty.sh
    thirdparty/download-thirdparty.sh
    thirdparty/patches/**

jobs:
  thirdparty:
    name: Thirdparty
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    outputs:
      key: ${{ steps.key.outputs.value }}
    steps:
      - uses: actions/checkout@v4
      - id: key
        run: echo "value=thirdparty-ubuntu24-${{ hashFiles('thirdparty/vars.sh', 'thirdparty/build-thirdparty.sh', 'thirdparty/download-thirdparty.sh', 'thirdparty/patches/**') }}" >> "$GITHUB_OUTPUT"
      - id: cache
        uses: actions/cache@v4
        with:
          path: thirdparty/installed
          key: ${{ steps.key.outputs.value }}
      - name: Install build dependencies
        if: steps.cache.outputs.cache-hit != 'true'
        run: sudo apt-get update -q && sudo apt-get install -y -q ${{ env.BUILD_PACKAGES }}
      - name: Build thirdparty
        if: steps.cache.outputs.cache-hit != 'true'
        run: cd thirdparty && ./build-thirdparty.sh -j "$(nproc)"

  fe-ut:
    name: FE UT
    needs: thirdparty
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: temurin
          cache: maven
          server-id: arenadata
          server-username: GITHUB_ACTOR
          server-password: GITHUB_TOKEN
      - name: Restore thirdparty
        uses: actions/cache/restore@v4
        with:
          path: thirdparty/installed
          key: ${{ needs.thirdparty.outputs.key }}
          fail-on-cache-miss: true
      - name: Install build dependencies
        run: sudo apt-get update -q && sudo apt-get install -y -q ${{ env.BUILD_PACKAGES }}
      - name: Run FE unit tests
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FE_UT_MODULES: fe-core
          FE_UT_RERUN: "2"
        run: ./run-fe-ut.sh
      - name: Upload FE surefire reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fe-surefire-reports
          path: '**/target/surefire-reports/'
          if-no-files-found: ignore

  be-build:
    name: BE Build (ASAN)
    needs: thirdparty
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    env:
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_MAXSIZE: 5G
      DORIS_CLANG_HOME: /usr/lib/llvm-20
      PARALLEL: "4"
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-java@v4
        with:
          java-version: 21
          distribution: temurin
          cache: maven
          server-id: arenadata
          server-username: GITHUB_ACTOR
          server-password: GITHUB_TOKEN
      - name: Restore thirdparty
        uses: actions/cache/restore@v4
        with:
          path: thirdparty/installed
          key: ${{ needs.thirdparty.outputs.key }}
          fail-on-cache-miss: true
      - name: ccache
        uses: actions/cache@v4
        with:
          path: .ccache
          key: be-ccache-${{ github.sha }}
          restore-keys: be-ccache-
      - name: Install build dependencies
        run: sudo apt-get update -q && sudo apt-get install -y -q ${{ env.BUILD_PACKAGES }}
      - name: Install LLVM 20
        run: |
          wget -qO /tmp/llvm.sh https://apt.llvm.org/llvm.sh
          chmod +x /tmp/llvm.sh
          sudo /tmp/llvm.sh 20
          sudo apt-get install -y -q libomp-20-dev
      - name: Build BE unit tests
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./run-be-ut.sh

  be-ut:
    name: BE UT (ASAN)
    needs: [be-build, thirdparty]
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    env:
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_MAXSIZE: 5G
      DORIS_CLANG_HOME: /usr/lib/llvm-20
      PARALLEL: "4"
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-java@v4
        with:
          java-version: 21
          distribution: temurin
          cache: maven
          server-id: arenadata
          server-username: GITHUB_ACTOR
          server-password: GITHUB_TOKEN
      - name: Restore thirdparty
        uses: actions/cache/restore@v4
        with:
          path: thirdparty/installed
          key: ${{ needs.thirdparty.outputs.key }}
          fail-on-cache-miss: true
      - name: Restore ccache
        uses: actions/cache/restore@v4
        with:
          path: .ccache
          key: be-ccache-${{ github.sha }}
          restore-keys: be-ccache-
      - name: Install build dependencies
        run: sudo apt-get update -q && sudo apt-get install -y -q ${{ env.BUILD_PACKAGES }}
      - name: Install LLVM 20
        run: |
          wget -qO /tmp/llvm.sh https://apt.llvm.org/llvm.sh
          chmod +x /tmp/llvm.sh
          sudo /tmp/llvm.sh 20
          sudo apt-get install -y -q libomp-20-dev
      - name: Run BE unit tests
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./run-be-ut.sh --run
      - name: Upload BE test log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: be-ut-log
          path: be/ut_build_ASAN/gtest_output/
          if-no-files-found: ignore
